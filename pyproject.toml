[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "eden-vision-ai"
version = "0.1.0"
description = "Independent local Vision AI service foundation for Project Eden"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic-settings>=2.7,<3",
    "Pillow>=12.3,<13",
    "pillow-heif>=1.8,<2",
    "python-multipart>=0.0.22,<0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1"]

[project.scripts]
eden-vision-ai = "eden_vision.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"eden_vision.resources" = ["taxonomy_*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
